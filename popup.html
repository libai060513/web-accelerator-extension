<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Web Accelerator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h3>Web Accelerator</h3>
  <label><input type="checkbox" id="lazy"> Enable lazy-load (images/iframes)</label>
  <label><input type="checkbox" id="prefetch"> Prefetch on hover</label>
  <label><input type="checkbox" id="hints"> Inject resource hints</label>
  <label>CDN prefix (optional): <input id="cdn" type="text" placeholder="https://cdn.example.com"></label>
  <div class="actions">
    <button id="save">Save</button>
    <button id="apply">Apply to current tab</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
